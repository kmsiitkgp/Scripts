# =========================================================================================
# TCGA-SPECIFIC — DOWNLOAD SETTINGS                        ← TCGA only
# =========================================================================================

gdc:
  n_processes:     8               # Parallel download connections (GDC recommends ≤8)
  retry_attempts:  3               # Number of retry attempts on download failure


# =========================================================================================
# CTDNA-SPECIFIC                                           ← ctDNA only
# =========================================================================================
# NOTE: this whole block is currently a placeholder. Only ichorcna: below has known-good
# defaults (pulled from runIchorCNA.R's own coded fallbacks — ploidy/normal/max_cn/
# include_homd; bin_size has no coded default, left null). Every other key here
# (bam_dir/biomodal_fa/gc_wig/map_wig) is read by ctdna.nf but was completely ABSENT from
# this yaml before this pass — you mentioned a real ichorcna: block already exists in a
# separate yaml you haven't merged in yet; paste it in below in place of these placeholders
# once you have it.

bam_dir:      null   # path to dir containing input BAM files
biomodal_fa:  null   # reference FASTA used to generate GC/mappability WIGs (only needed if
                     # gc_wig/map_wig below are null and HMMCOPY_REFWIG must generate them)
gc_wig:       null   # pre-existing GC content WIG — if set (with map_wig), skips HMMCOPY_REFWIG entirely
                     # e.g. prebuilt ichorCNA reference tracks (gc_hg38_1000kb.wig) — see
                     # 01_ichorCNA_setup.sh for how these were originally sourced/copied
                     # into a shared resource dir
map_wig:      null   # pre-existing mappability WIG — see gc_wig above

# --- PASTE YOUR REAL ichorcna: BLOCK HERE, replacing this placeholder ---
ichorcna:
  bin_size:     null   # ← NO coded default found in runIchorCNA.R/.nf; needs your real value
  ploidy:       "c(2,3)"                              # matches runIchorCNA.R's own default
  normal:       "c(0.5,0.6,0.7,0.8,0.9,0.95,0.99)"     # matches runIchorCNA.R's own default
  max_cn:       5                                      # matches runIchorCNA.R's own default
  include_homd: false                                  # matches runIchorCNA.R's own default
