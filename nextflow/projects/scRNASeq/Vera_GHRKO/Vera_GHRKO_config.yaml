        cluster_col:     "harmony_res1.2"

  # --- Pseudobulk (Section 6 of scrnaseq.nf) ---
  # Entry-driven, not exhaustive: only CellType/Lineage values explicitly named in an
  # `analyses` entry below get a pseudobulk expr_mat/metadata/DEGs/Pathways/TFs run at
  # all — a CellType present in the object but not listed here produces no output.
  # Each entry selects cells via EITHER `cellType` OR `Lineage` (pick one), merging
  # multiple values into a single population if a list of >1 is given, and carries its
  # OWN `contrasts` list (independent of deseq2.contrasts, which is RNAseq-only — see
  # the RNASEQ-SPECIFIC DIFFERENTIAL EXPRESSION section above).
  pseudobulk:
    enabled:              true
    min_cells_per_sample:  100   # an individual Sample is dropped from an entry if it
                                  # contributed fewer than this many cells to it (applies
                                  # to the COMBINED cell count across every value merged
                                  # into one entry below)
    analyses:
      # Scenario 1: Single cell type, multiple individual contrasts
      #- cellType: ["Goblet Cells"]
      #  contrasts:
      #    - "GHRKO_Late-WT_Late"
      #    - "GHRKO_Early-WT_Early"

      # Scenario 2: Multiple cell types combined into ONE group, multiple contrasts
      #- cellType: ["Goblet Cells", "Stem Cells"]
      #  contrasts:
      #    - "GHRKO_Late-WT_Late"
      #    - "GHRKO_Early-WT_Early"

      # Scenario 3: Using Lineage instead of cellType, with a single contrast
      #- Lineage: ["Epithelial"]
      #  contrasts:
      #    - "GHRKO_Late-WT_Late"
      - cellType:  ["Goblet cells"]
        contrasts:
          - "GHRKO_Late-WT_Late"
          - "GHRKO_Early-WT_Early"
      - cellType:  ["Colonocytes"]
        contrasts:
          - "GHRKO_Late-WT_Late"
          - "GHRKO_Early-WT_Early"
      - cellType:  ["Crypt-Base Stem cells"]
        contrasts:
          - "GHRKO_Late-WT_Late"
          - "GHRKO_Early-WT_Early"
      - cellType:  ["Transit-amplifying cells"]
        contrasts:
          - "GHRKO_Late-WT_Late"
          - "GHRKO_Early-WT_Early"
      #- cellType:  ["Colonocytes (Mature)"]
      #  contrasts:
      #    - "GHRKO_Late-WT_Late"
      #    - "GHRKO_Early-WT_Early"
      #- cellType:  ["Colonocytes (Terminal)"]
      #  contrasts:
      #    - "GHRKO_Late-WT_Late"
      #    - "GHRKO_Early-WT_Early"
      #- cellType:  ["Paneth Cells"]
      #  contrasts:
      #    - "GHRKO_Late-WT_Late"
      #    - "GHRKO_Early-WT_Early"
      - cellType:  ["Fibroblasts"]
        contrasts:
          - "GHRKO_Late-WT_Late"
          - "GHRKO_Early-WT_Early"
      #- cellType:  ["Fibroblasts (ECM producing)"]
