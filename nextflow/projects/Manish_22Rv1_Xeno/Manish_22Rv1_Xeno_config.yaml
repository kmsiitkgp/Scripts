# =========================================================================================
# PROJECT CONFIGURATION FILE
# =========================================================================================
# This YAML file configures the RNA-seq pipeline. The pipeline reads this file to:
#   1. Locate mapping file (map_file) [OPTIONAL]
#   2. Locate input FASTQ files (read_dir)
#   3. Set output locations (base_dir, work_dir)
#   4. Set download locations (ref_dir, cache_dir)
#   5. Configure alignment/quantification tools (star_align, salmon_quant)
#
# Usage:
#   nextflow run main.nf -params-file project_info.yaml
#
# Quick Start:
#   1. Set experiment type, project name, species
#   2. Set read_dir to your FASTQ location
#   3. Set ref_dir to download reference genome
#   4. Set cache_dir to download singularity images
#   5. Set base_dir to store analysis results
#   6. Set work_dir to store intermediate results
#   7. Leave STAR/Salmon defaults unchanged (unless specific needs)
# =========================================================================================

# -----------------------------------------------------------------------------------------
# PROJECT METADATA
# -----------------------------------------------------------------------------------------

expt: "RNASeq"                     #   Experiment type (determines output structure)
#species: "Human"                   #   "Human", "Mouse", "Xenograft"
#species: "Mouse"
species: "Xenograft"
project: "Manish_22Rv1_Xeno"  #   Project name (used in output directory naming)
run_mode: "bulk+de"   #bulk , de or bulk+de

# Required only if run_mode is "de"
type: #"split"            # If xenograft, use "split". Else, use "full"
gene_counts: #"/path/to/04.STAR/gene_counts/*.tab"
salmon_dir: #"/path/to/03.Salmon/"
gtf: #"/path/to/reference/your_file.gtf"
genome_version: #"GRCh38.115"
assembly: #"GRCh38"
release: #"115"

# -----------------------------------------------------------------------------------------
# PRIMARY ANALYSIS INPUT FILES & DIRECTORIES
# -----------------------------------------------------------------------------------------

# Input: Directory containing raw FASTQ files
# Expected naming: *_R1.fq.gz, *_R2.fq.gz (or _r1, _r2, .fastq.gz)
# See docs/validate_input.md for file naming requirements
read_dir: "/hpc/home/kailasamms/scratch/RNASeq_Xenograft_Manish_22Rv1_Xeno/input"

yaml_file:     "/hpc/home/kailasamms/scripts/nextflow/projects/Manish_22Rv1_Xeno/Manish_22Rv1_Xeno_config.yaml"
map_file:      "/hpc/home/kailasamms/scripts/nextflow/projects/Manish_22Rv1_Xeno/Manish_22Rv1_Xeno_fastq_map.txt"
metadata_file: "/hpc/home/kailasamms/scripts/nextflow/projects/Manish_22Rv1_Xeno/Manish_22Rv1_Xeno_metadata.xlsx"

# -----------------------------------------------------------------------------------------
# DIFFERENTIAL EXPRESSION INPUT FILES & PARAMETERS
# -----------------------------------------------------------------------------------------

# DESeq2 Analysis Settings
deseq2:
  design: "0+Comparisons"      # Metadata column name to use for the formula (e.g., "0 + Condition")
  lfc_cutoff: 0                # Log2 Fold Change threshold for labeling "Significant" genes
  padj_cutoff: 0.1             # Adjusted p-value (FDR) threshold (standard is 0.05 or 0.1)
  batch_vars: null             # Metadata column name(s) to use for the formula (e.g., "0 + Batch + Condition")
  contrasts:                   # Format: "Numerator-Denominator"
    - "SPB-Vehicle"
    - "IRR-Vehicle"
    - "SPB_IRR-Vehicle"
    - "SPB_IRR-IRR"            # Equivalent to (SPB_IRR - Vehicle) - (IRR - Vehicle)

gsea:
  padj_cutoff: 0.05
  minsize: 15
  maxsize: 500
  only_deg: "FALSE"          # Input is only DEGs
  top_n: 10                  # Top 10 UP and Top 10 DOWN pathways

# Heatmap Visualization Settings
heatmap:
#  metadata_col: null                # Dataframe with samples as rownames and columns for annotation
#  metadata_row: null                # Dataframe with genes as rownames and columns for annotation
  col_annotations: ["Treatment"]    # List of columns from metadata_col to show as colored bars at top
#  row_annotations: null             # List of columns from metadata_row to show as colored bars on side
#  col_gap_by: null                  # Single column from metadata_col to define column gaps
#  row_gap_by: null                  # Single column from metadata_row to define row gaps
  col_cluster_by: "Treatment"       # Single column from metadata_col, "all" unsupervised, or "alphabetical" to define column ordering
#  row_cluster_by: "all"             # Single column from metadata_row, "all" unsupervised, or "alphabetical" to define row ordering
  heatmap_palette: "rdbu"           # "rdbu" (Red-Blue) or "vrds" (Viridis)
#  plot_title: null                  # Title for heatmap (default no title)
#  border_color: "NA"                # Color of cell borders; use "NA" for no borders (cleaner for many genes)
#  show_expr_legend: true            # Set to false if annotation legends are taking up too much space

#  label_genes: null                 # List of specific gene names to label (e.g., ["GAPDH", "MYC"])
#  filename: null                    # Suffix added to filename
#  output_dir: null                  # Location to save plot and matrix
#  annotation_palette: "discrete"    # "discrete" for categories, "continuous" for numeric gradients
#  force_log: false                  # Force log2 transformation (default false auto-detects)
#  save_plot: false                  # If true, exports a high-res PDF
#  save_matrix: false                # If true, exports the underlying expression values to .xlsx


# Volcano Plot Settings
volcano:
  contrast: "Target-Reference"      # The specific contrast name to use for the plot
  label_genes: null                 # List of specific gene names to label (e.g., ["GAPDH", "MYC"])
  filename: null                    # Suffix added to filename
  top_n: 5                          # Number of top significant genes to automatically label
  lfc_cutoff: 0.58                  # Log2FC line (0.58 is roughly a 1.5x fold change)
  padj_cutoff: 0.05                 # Horizontal significance line (-log10 of p-adj)

# =========================================================================================
# ALIGNMENT PARAMETERS
# =========================================================================================
# These are passed to STAR alignment. Defaults work well for standard RNA-seq.
# For parameter details, see: docs/star_align.md
#
# Advanced users: Modify values as needed
# Standard users: Leave defaults unchanged
# =========================================================================================

star_align:
  runMode: "alignReads"
  twopassMode: "Basic"                        #   Novel junction discovery (2-5% better mapping)
  quantMode: "GeneCounts"                     #   Generate gene counts for DESeq2/edgeR
  sjdbOverhang: 100                           #   ReadLength - 1 (100 works for 75-150bp reads)
  readFilesCommand: "zcat"                    #   For .gz files
  outFilterMultimapNmax: 10                   #   Allow reads mapping to ≤10 loci
  outFilterMismatchNmax: 999                  #   Use percentage filter (below)
  outFilterMismatchNoverReadLmax: 0.04        #   Max 4% mismatches per read
  outFilterType: "BySJout"                    #   Filter low-confidence junctions
  alignEndsType: "Local"                      #   Allow soft-clipping at ends
  alignIntronMin: 20                          #   Min intron size (gaps <20bp = deletions)
  alignIntronMax: 1000000                     #   Max intron size (1 Mb)
  alignMatesGapMax: 1000000                   #   Max distance between PE mates
  outSAMattributes: "NH HI AS nM MD"          #   MD tag needed for RSeQC
  outSAMunmapped: "Within"                    #   Include unmapped reads in BAM
  outSAMtype: ["BAM", "SortedByCoordinate"]   # Sorted BAM output
  limitSjdbInsertNsj: 1500000

# =========================================================================================
# QUANTIFICATION PARAMETERS
# =========================================================================================
# These are passed to Salmon quantification. Defaults enable bias corrections.
# For parameter details, see: docs/salmon_quant.md
#
# Advanced users: Modify values as needed
# Standard users: Leave defaults unchanged
# =========================================================================================

salmon_quant:
 #libType: "IU"  #   Forced to Unstranded (IU) instead of Auto-detect (A)
  libType: "A"   #   Auto-detect library type (strand orientation)
  gcBias: true   #   Correct GC content bias (~5% improvement)
  seqBias: true  #   Correct hexamer priming bias (~3% improvement)
  posBias: true  #   Correct positional bias (~2% improvement)
  numBootstraps: 30
  threads: 1

# -----------------------------------------------------------------------------------------
# OUTPUT DIRECTORIES
# -----------------------------------------------------------------------------------------

# Output: Base directory for all pipeline results
base_dir: "/hpc/home/kailasamms/scratch"

# Work: Nextflow intermediate files (enables -resume, can delete after completion)
work_dir: "/hpc/home/kailasamms/scratch/nf_work"

# Cache: Container image storage (can be shared across projects)
cache_dir: "/hpc/home/kailasamms/NGSTools/singularity_cache"

# Reference: Reference genome storage (can be shared across projects)
ref_dir: "/hpc/home/kailasamms/NGSTools/Reference_Genomes"

# GMT Files: (can be shared across projects)
gmt_dir: "/hpc/home/kailasamms/NGSTools/Signatures"

